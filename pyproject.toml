[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "noisiq"
version = "0.2.0"
description = "Noise-aware quantum circuit simulation and visualization: see where errors happen and how they spread."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "David Saxum" },
    { name = "Teddy Jones" },
    { name = "Giovanni Castorina" },
]
keywords = ["quantum computing", "quantum circuits", "noise", "error propagation", "visualization", "education"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Visualization",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
    "stim>=1.13",
]

[project.optional-dependencies]
qiskit = ["qiskit>=1.0", "qiskit-aer>=0.14"]
widgets = ["ipywidgets>=8.0", "ipython>=8.0"]
test = ["pytest>=7.4", "pytest-cov>=4.1", "pillow>=9"]
dev = ["noisiq[test,qiskit,widgets]", "ruff>=0.4", "build>=1.0", "nbformat>=5.9", "nbclient>=0.9", "ipykernel>=6"]

[project.urls]
Homepage = "https://github.com/dtsaxum-oss/NoisiQ"
Repository = "https://github.com/dtsaxum-oss/NoisiQ"
Issues = "https://github.com/dtsaxum-oss/NoisiQ/issues"
Changelog = "https://github.com/dtsaxum-oss/NoisiQ/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/noisiq"]

[tool.hatch.build.targets.sdist]
include = ["src/noisiq", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: long-running statistical or large-circuit tests (deselect with -m 'not slow')",
    "qiskit: needs qiskit and qiskit-aer",
]
filterwarnings = ["ignore:Animation was deleted without rendering:UserWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
ignore = ["E741", "B905", "UP007", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
